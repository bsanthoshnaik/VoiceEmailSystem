
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Voice Email Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: min(360px, 85%);
            box-shadow: 0 6px 24px #1a2a4b15;
        }
        h2 {
            color: #182848;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccd4e2;
            border-radius: 8px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2855d9;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .errorlist {
            color: #bd3030;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <p>Sign in to your Voice Email Assistant account.</p>

        {% if form.errors %}
            <p style="color:#bd3030;">
                Login failed. Check your username and password.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="/">

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                autocomplete="username"
                required
            >

            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
